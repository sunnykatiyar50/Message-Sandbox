# Creates the GitHub Release when a version tag is pushed (scripts/release.js does this).
# The image itself is built and published by docker.yml, which runs on the same tag.
#
# The release carries a docker-compose.yml pinned to the released image version, and sample.env.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # create the release

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Pin docker-compose.yml to this version
        run: |
          mkdir release-assets
          version="${GITHUB_REF_NAME#v}"
          sed "s/IMAGE_TAG:-latest/IMAGE_TAG:-$version/" docker-compose.yml > release-assets/docker-compose.yml
          grep -q "IMAGE_TAG:-$version" release-assets/docker-compose.yml
          cp sample.env release-assets/sample.env

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tags like v1.2.3-rc.1 are marked as pre-releases
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          # --generate-notes lists the pull requests and commits since the previous release
          gh release create "$GITHUB_REF_NAME" release-assets/docker-compose.yml release-assets/sample.env \
            --title "$GITHUB_REF_NAME" --generate-notes $prerelease
