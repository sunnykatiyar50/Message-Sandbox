# Message Sandbox, using the prebuilt image from GitHub Container Registry.
#
#   cp sample.env .env      # then fill in the required values
#   docker compose up -d
#   docker compose pull && docker compose up -d     # update to the latest image
#   IMAGE_TAG=1.2.0 docker compose up -d             # pin a released version (see the Releases page)
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build   # build from source
#
# Settings come from .env. Databases, bind mounts and TLS: see README.md, "Running with Docker" and
# "Database setup".
services:
  message-sandbox:
    image: ghcr.io/sunnykatiyar50/message-sandbox:${IMAGE_TAG:-latest}
    init: true
    user: 1000:1000
    env_file: .env
    # "<host port>:<container port>". Choose any host port (left); keep the container port (right)
    # equal to the variable in .env, e.g. "2525:1025" publishes SMTP on host port 2525.
    ports:
      - "30005:30005"   # dashboard and API (PORT)
      - "1025:1025"     # SMTP (SMTP_PORT)
      # - "1465:1465"   # SMTP over TLS (SMTP_TLS_PORT, when set)
    # Container paths (working directory /app):
    #   /app/data   SQLite database (SQLITE_PATH) and Let's Encrypt certificates (ACME_DIR=/app/data/certs)
    #   /app/logs   log files (LOG_DIR)
    #   /certs      your own certificate and key instead of ACME (SMTP_TLS_KEY, SMTP_TLS_CERT)
    volumes:
      - message-sandbox-data:/app/data
      - message-sandbox-logs:/app/logs
      # - ./certs:/certs:ro
      # bind mounts instead of volumes:
      # - ./data:/app/data
      # - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # bundled database only:
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    #     required: false
    #   mysql:
    #     condition: service_healthy
    #     required: false
    restart: unless-stopped

